name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hooks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck hooks/*.sh
      - name: hook tests
        run: bash hooks/test-pre-push-review.sh
